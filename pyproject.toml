[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shader-permutation-pruner"
version = "1.0.0"
description = "Shader permutation pruning and first-frame compile benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shader-permute = "shader_permutations.cli:main"

[tool.setuptools.packages.find]
include = ["shader_permutations*"]
