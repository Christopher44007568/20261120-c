<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boids 群集模拟 + 各向异性织物高光</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
    #app { width: 100%; height: 100%; }
    .panel {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(10, 14, 22, 0.78); color: #cfe3ff;
      font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
      padding: 10px 14px; border-radius: 8px; border: 1px solid #2a3a55;
      min-width: 240px; user-select: none;
    }
    .panel h1 { font-size: 13px; margin: 0 0 6px; color: #7fb4ff; }
    .stat b { color: #ffd479; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .row label { width: 96px; color: #9db8dd; }
    .row input[type=range] { flex: 1; accent-color: #5b9dff; }
    .row span { width: 36px; text-align: right; color: #ffd479; }
    #fabricPanel { top: auto; bottom: 12px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="panel" id="hud">
    <h1>Boids 群集模拟</h1>
    <div class="stat">群集数量: <b id="statCount">-</b></div>
    <div class="stat">帧耗时: <b id="statFrame">-</b> ms (模拟 <b id="statSim">-</b> ms)</div>
    <div class="stat">障碍物净距: <b id="statClearance">-</b></div>
    <div class="row"><label>分离 separation</label><input id="sep" type="range" min="0" max="4" step="0.05"><span id="sepV"></span></div>
    <div class="row"><label>对齐 alignment</label><input id="ali" type="range" min="0" max="3" step="0.05"><span id="aliV"></span></div>
    <div class="row"><label>聚合 cohesion</label><input id="coh" type="range" min="0" max="4" step="0.05"><span id="cohV"></span></div>
  </div>
  <div class="panel" id="fabricPanel">
    <h1>旋转织物 · 各向异性高光 (Kajiya-Kay)</h1>
    <div class="stat">高光方向跟随切线方向同步旋转</div>
    <div class="row"><label>旋转速度</label><input id="rotSpeed" type="range" min="0" max="2" step="0.05" value="0.6"><span id="rotV"></span></div>
    <div class="row"><label>高光锐度</label><input id="shininess" type="range" min="4" max="128" step="1" value="48"><span id="shiV"></span></div>
  </div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./src/demo.js"></script>
</body>
</html>
